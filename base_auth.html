<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daily Journal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; min-height:100vh; background:linear-gradient(135deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%); display:flex; align-items:center; justify-content:center; padding:20px; }
        .card { border:none; border-radius:16px; }
        .form-control { border-radius:10px; border:1.5px solid #e5e7eb; padding:10px 14px; }
        .form-control:focus { border-color:#6C63FF; box-shadow:0 0 0 3px rgba(108,99,255,0.1); }
        .btn-primary { background:#6C63FF; border-color:#6C63FF; }
        .btn-primary:hover { background:#8B85FF; border-color:#8B85FF; }
        .alert { border:none; border-radius:12px; }
    </style>
</head>
<body>
    {% if messages %}
    <div style="position:fixed;top:20px;right:20px;z-index:9999;">
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show shadow">
            {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div style="width:100%;max-width:860px;">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
