{% extends 'daily_journal/base.html' %}
{% block title %}Delete Entry{% endblock %}
{% block page_title %}Delete Entry{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card text-center">
            <div class="card-body p-5">
                <div class="mb-4">
                    <div style="width:80px;height:80px;background:#fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                        <i class="fas fa-trash fa-2x text-danger"></i>
                    </div>
                    <h4 class="fw-bold">Delete Entry?</h4>
                    <p class="text-muted">Are you sure you want to delete <strong>"{{ entry.title }}"</strong>? This action cannot be undone.</p>
                </div>
                <form method="post" class="d-flex gap-2 justify-content-center">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4 fw-semibold">
                        <i class="fas fa-trash me-2"></i>Yes, Delete
                    </button>
                    <a href="{% url 'entry_detail' entry.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
