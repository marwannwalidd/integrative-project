{% extends 'daily_journal/base.html' %}
{% block title %}{{ action }} Reminder{% endblock %}
{% block page_title %}{{ action }} Reminder{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><i class="fas fa-bell me-2"></i>Set Reminder</div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Reminder Time</label>
                        {{ form.reminder_time }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Message</label>
                        {{ form.message }}
                    </div>
                    <div class="mb-4 form-check">
                        {{ form.is_active }}
                        <label class="form-check-label fw-semibold" for="{{ form.is_active.id_for_label }}">Active</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-save me-2"></i>Save Reminder
                        </button>
                        <a href="{% url 'reminder_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
